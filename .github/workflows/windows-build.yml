# Builds the Windows executables and the installer on GitHub's Windows
# runners - no local Windows machine needed. Trigger it from the Actions tab
# (workflow_dispatch), or push a version tag like v1.0.0.
#
# Artifacts: AOPS-Setup-<version>.exe (the installer) and AOPS-portable
# (the bare one-folder app, for running without installing).

name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Freeze, smoke-test and compile the installer
        run: python packaging/build.py --installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AOPS-Setup
          path: dist/AOPS-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: AOPS-portable
          path: dist/AOPS/
          if-no-files-found: error
